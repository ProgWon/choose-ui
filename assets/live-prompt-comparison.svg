<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Live Claude Code prompt comparison without and with Choose UI</title>
  <desc id="desc">The baseline recommends a single radio button. With Choose UI, Claude recommends no selection control and read-only confirmation text.</desc>
  <rect width="1280" height="640" fill="#0b1020"/>
  <text x="64" y="66" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="700">Same prompt. Same model. One skill changes the decision.</text>
  <text x="64" y="101" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">Exact excerpts from fresh Claude Code 2.1.222 · sonnet sessions · 2026-08-05</text>

  <rect x="64" y="138" width="556" height="430" rx="22" fill="#151c2f" stroke="#fb7185" stroke-width="2"/>
  <circle cx="101" cy="177" r="10" fill="#fb7185"/>
  <text x="124" y="184" fill="#fda4af" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700">WITHOUT CHOOSE UI</text>
  <text x="100" y="238" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="23" font-weight="700">“Single pre-selected radio button</text>
  <text x="100" y="272" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="23" font-weight="700">inside a radiogroup.”</text>
  <text x="100" y="326" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">“This keeps the same markup pattern if a</text>
  <text x="100" y="354" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">second shipping option is ever added.”</text>
  <rect x="100" y="406" width="484" height="94" rx="14" fill="#311827"/>
  <circle cx="137" cy="453" r="13" fill="none" stroke="#fda4af" stroke-width="3"/>
  <text x="166" y="448" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="650">Standard shipping</text>
  <text x="166" y="476" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">The only available option</text>

  <rect x="660" y="138" width="556" height="430" rx="22" fill="#151c2f" stroke="#34d399" stroke-width="2"/>
  <circle cx="697" cy="177" r="10" fill="#34d399"/>
  <text x="720" y="184" fill="#6ee7b7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700">WITH CHOOSE UI</text>
  <text x="696" y="238" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="23" font-weight="700">“No selection control.”</text>
  <text x="696" y="292" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">“One option … isn't a choice.”</text>
  <text x="696" y="320" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">“The correct pattern is to auto-apply the value</text>
  <text x="696" y="348" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">and simply display it for confirmation.”</text>
  <rect x="696" y="406" width="484" height="94" rx="14" fill="#102c29"/>
  <text x="728" y="448" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="650">Standard shipping</text>
  <text x="728" y="476" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">$5.00 · arrives in 3–5 business days</text>

  <text x="64" y="608" fill="#64748b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">Full prompt, run conditions, and unedited outputs: examples/live-comparison.md</text>
</svg>
