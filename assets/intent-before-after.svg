<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Action and view controls before and after Choose UI</title>
  <desc id="desc">Without the skill, commands and view modes are both represented as selects. With the skill, an action menu represents commands and a segmented control represents view switching.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#17213A" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F8FF"/>
      <stop offset="1" stop-color="#FFF7F0"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="760" rx="28" fill="url(#bg)"/>
  <text x="72" y="72" fill="#17213A" font-family="Inter, ui-sans-serif, system-ui" font-size="28" font-weight="750">Name the intent before the component</text>
  <text x="72" y="108" fill="#62708F" font-family="Inter, ui-sans-serif, system-ui" font-size="18">Similar-looking controls communicate different user tasks.</text>

  <g filter="url(#shadow)">
    <rect x="72" y="152" width="618" height="500" rx="24" fill="#FFFFFF"/>
    <rect x="750" y="152" width="618" height="500" rx="24" fill="#FFFFFF"/>
  </g>

  <rect x="96" y="176" width="168" height="34" rx="17" fill="#FFF0F0"/>
  <circle cx="118" cy="193" r="7" fill="#E95555"/>
  <text x="135" y="199" fill="#AA3434" font-family="Inter, ui-sans-serif, system-ui" font-size="14" font-weight="700">WITHOUT SKILL</text>
  <text x="112" y="266" fill="#17213A" font-family="Inter, ui-sans-serif, system-ui" font-size="24" font-weight="720">Orders</text>
  <text x="112" y="300" fill="#78849E" font-family="Inter, ui-sans-serif, system-ui" font-size="15">Manage and inspect recent orders.</text>
  <text x="112" y="354" fill="#35415D" font-family="Inter, ui-sans-serif, system-ui" font-size="13" font-weight="650">Action</text>
  <rect x="112" y="370" width="250" height="58" rx="11" fill="#FFFFFF" stroke="#C9D0DC" stroke-width="2"/>
  <text x="134" y="406" fill="#33405B" font-family="Inter, ui-sans-serif, system-ui" font-size="16">Export CSV</text>
  <path d="M327 393l8 8 8-8" fill="none" stroke="#7C879B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="390" y="354" fill="#35415D" font-family="Inter, ui-sans-serif, system-ui" font-size="13" font-weight="650">View</text>
  <rect x="390" y="370" width="260" height="58" rx="11" fill="#FFFFFF" stroke="#C9D0DC" stroke-width="2"/>
  <text x="412" y="406" fill="#33405B" font-family="Inter, ui-sans-serif, system-ui" font-size="16">List view</text>
  <path d="M615 393l8 8 8-8" fill="none" stroke="#7C879B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="112" y="464" width="538" height="108" rx="14" fill="#FFF6F6"/>
  <text x="136" y="494" fill="#B74646" font-family="Inter, ui-sans-serif, system-ui" font-size="14" font-weight="720">Two selects, two semantic mismatches</text>
  <text x="136" y="522" fill="#8C5960" font-family="Inter, ui-sans-serif, system-ui" font-size="13">“Export” executes a command; it does not set a value.</text>
  <text x="136" y="546" fill="#8C5960" font-family="Inter, ui-sans-serif, system-ui" font-size="13">“View” changes the same content; it does not submit form data.</text>

  <rect x="774" y="176" width="148" height="34" rx="17" fill="#EAF8F0"/>
  <circle cx="796" cy="193" r="7" fill="#25A866"/>
  <text x="813" y="199" fill="#187849" font-family="Inter, ui-sans-serif, system-ui" font-size="14" font-weight="700">WITH SKILL</text>
  <text x="790" y="266" fill="#17213A" font-family="Inter, ui-sans-serif, system-ui" font-size="24" font-weight="720">Orders</text>
  <text x="790" y="300" fill="#78849E" font-family="Inter, ui-sans-serif, system-ui" font-size="15">Manage and inspect recent orders.</text>
  <rect x="790" y="358" width="172" height="58" rx="11" fill="#5267F5"/>
  <path d="M820 381v16m0 0l-6-6m6 6l6-6m-13 13h14" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="842" y="394" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui" font-size="16" font-weight="700">Export</text>
  <rect x="970" y="358" width="58" height="58" rx="11" fill="#FFFFFF" stroke="#C9D0DC" stroke-width="2"/>
  <circle cx="991" cy="387" r="2.6" fill="#526078"/><circle cx="999" cy="387" r="2.6" fill="#526078"/><circle cx="1007" cy="387" r="2.6" fill="#526078"/>
  <rect x="1070" y="358" width="258" height="58" rx="13" fill="#EEF1F7"/>
  <rect x="1074" y="362" width="124" height="50" rx="10" fill="#FFFFFF"/>
  <path d="M1095 379h18m-18 7h18m-18 7h18" fill="none" stroke="#5267F5" stroke-width="2.2" stroke-linecap="round"/>
  <text x="1121" y="393" fill="#293650" font-family="Inter, ui-sans-serif, system-ui" font-size="14" font-weight="700">List</text>
  <rect x="1220" y="379" width="6" height="6" rx="1" fill="#718099"/><rect x="1230" y="379" width="6" height="6" rx="1" fill="#718099"/><rect x="1220" y="389" width="6" height="6" rx="1" fill="#718099"/><rect x="1230" y="389" width="6" height="6" rx="1" fill="#718099"/>
  <text x="1246" y="393" fill="#58657D" font-family="Inter, ui-sans-serif, system-ui" font-size="14">Grid</text>

  <rect x="790" y="464" width="538" height="108" rx="14" fill="#EEF9F3"/>
  <text x="814" y="494" fill="#187849" font-family="Inter, ui-sans-serif, system-ui" font-size="14" font-weight="720">One component family per intent</text>
  <text x="814" y="522" fill="#507463" font-family="Inter, ui-sans-serif, system-ui" font-size="13">Action → button or action menu</text>
  <text x="814" y="546" fill="#507463" font-family="Inter, ui-sans-serif, system-ui" font-size="13">View switch → segmented control for a short set</text>

  <rect x="332" y="682" width="776" height="46" rx="23" fill="#17213A"/>
  <text x="372" y="711" fill="#C9D2E8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">classify intent  →  apply constraints  →  adapt to design system</text>
</svg>
