<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">One shipping option before and after Choose UI</title>
  <desc id="desc">Without the skill, a one-item disabled dropdown implies a choice. With Choose UI, the single value is applied and displayed as readable text.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#17213A" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F8FF"/>
      <stop offset="1" stop-color="#EEF7FF"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="760" rx="28" fill="url(#bg)"/>
  <text x="72" y="72" fill="#17213A" font-family="Inter, ui-sans-serif, system-ui" font-size="28" font-weight="750">One option is not a choice</text>
  <text x="72" y="108" fill="#62708F" font-family="Inter, ui-sans-serif, system-ui" font-size="18">Choose UI removes interaction that cannot change the outcome.</text>

  <g filter="url(#shadow)">
    <rect x="72" y="152" width="618" height="500" rx="24" fill="#FFFFFF"/>
    <rect x="750" y="152" width="618" height="500" rx="24" fill="#FFFFFF"/>
  </g>

  <rect x="96" y="176" width="168" height="34" rx="17" fill="#FFF0F0"/>
  <circle cx="118" cy="193" r="7" fill="#E95555"/>
  <text x="135" y="199" fill="#AA3434" font-family="Inter, ui-sans-serif, system-ui" font-size="14" font-weight="700">WITHOUT SKILL</text>

  <text x="112" y="266" fill="#17213A" font-family="Inter, ui-sans-serif, system-ui" font-size="24" font-weight="720">Shipping method</text>
  <text x="112" y="298" fill="#78849E" font-family="Inter, ui-sans-serif, system-ui" font-size="15">Choose how your order should arrive.</text>
  <text x="112" y="352" fill="#35415D" font-family="Inter, ui-sans-serif, system-ui" font-size="14" font-weight="650">Delivery option</text>
  <rect x="112" y="370" width="538" height="64" rx="12" fill="#F3F5F8" stroke="#CED4DF" stroke-width="2"/>
  <text x="136" y="408" fill="#69748B" font-family="Inter, ui-sans-serif, system-ui" font-size="17">Standard shipping</text>
  <path d="M611 396l8 8 8-8" fill="none" stroke="#9AA3B4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="112" y="466" width="538" height="56" rx="12" fill="#E9ECF2"/>
  <text x="329" y="501" fill="#8993A6" font-family="Inter, ui-sans-serif, system-ui" font-size="16" font-weight="700">Continue</text>
  <rect x="112" y="554" width="538" height="66" rx="12" fill="#FFF6F6"/>
  <text x="136" y="581" fill="#B74646" font-family="Inter, ui-sans-serif, system-ui" font-size="14" font-weight="700">Extra interaction, zero agency</text>
  <text x="136" y="604" fill="#8C5960" font-family="Inter, ui-sans-serif, system-ui" font-size="13">A disabled or one-item dropdown falsely implies choice.</text>

  <rect x="774" y="176" width="148" height="34" rx="17" fill="#EAF8F0"/>
  <circle cx="796" cy="193" r="7" fill="#25A866"/>
  <text x="813" y="199" fill="#187849" font-family="Inter, ui-sans-serif, system-ui" font-size="14" font-weight="700">WITH SKILL</text>

  <text x="790" y="266" fill="#17213A" font-family="Inter, ui-sans-serif, system-ui" font-size="24" font-weight="720">Shipping method</text>
  <text x="790" y="298" fill="#78849E" font-family="Inter, ui-sans-serif, system-ui" font-size="15">Your only available option is already applied.</text>
  <rect x="790" y="336" width="538" height="112" rx="16" fill="#F4F8FF" stroke="#C8D8FF" stroke-width="2"/>
  <circle cx="830" cy="381" r="20" fill="#5B6EF5"/>
  <path d="M820 381l7 7 14-16" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="866" y="378" fill="#1F2B47" font-family="Inter, ui-sans-serif, system-ui" font-size="18" font-weight="720">Standard shipping</text>
  <text x="866" y="408" fill="#63708B" font-family="Inter, ui-sans-serif, system-ui" font-size="15">Arrives Tuesday · Free</text>
  <rect x="790" y="480" width="538" height="56" rx="12" fill="#5267F5"/>
  <text x="1002" y="515" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui" font-size="16" font-weight="700">Continue</text>
  <rect x="790" y="554" width="538" height="66" rx="12" fill="#EEF9F3"/>
  <text x="814" y="581" fill="#187849" font-family="Inter, ui-sans-serif, system-ui" font-size="14" font-weight="700">Static value, automatically applied</text>
  <text x="814" y="604" fill="#507463" font-family="Inter, ui-sans-serif, system-ui" font-size="13">Readable confirmation stays in the form submission.</text>

  <rect x="397" y="682" width="646" height="46" rx="23" fill="#17213A"/>
  <text x="436" y="711" fill="#C9D2E8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">intent=input  ·  options=1  →  static value</text>
</svg>
