name: Test Choose UI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m unittest discover -s tests -v
      - run: python3 .claude/skills/choose-ui/scripts/rules_tool.py --check
      - run: python3 .claude/skills/choose-ui/scripts/recommend.py --intent input --options 5 --platform desktop
